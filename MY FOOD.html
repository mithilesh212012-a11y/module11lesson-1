<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my food</title>
    <style>
        body{
            font-family:arial;
            background:#fff8f0;
            padding:30px;
            text-align:center;
        }

        h1 {color:#e65c00}

        /*sibling selector-styles the parahgraph right after h1*/
        h1 + p{
            background:#ffe0b2;
            padding:10px 20px;
            border-radius:8px;
            color:#bf360c;
            display:inline-block
        }

        ul {padding:0;margin-top:20px}

        /*child selector -style only direct li children of ul*/
        ul >li{
            list-style:none;
            font-size:18px;
            font-weight:bold;
            color:#5d4037;
            padding:10px 20px;
            margin:6px auto;
            width:260px;
            background:#fff3e0;
            border-radius:8px;
        }

        /* nth-child-highlights the 3rd item as chef's special*/
        ul li:nth-child(3){
            background:#ffe083;
            color:#e65c00
        }

        .desc{
            color:#555;
            margin-top:20px;
            font-size:15px;
            max-width:400px;
            margin-left:auto;
            margin-right:auto;
        }

        /*first-letter-makes the first letter big and bold*/
        .desc::first-letter{
            font-size: 220%;
            color:#e65c00;
            font-weight:bold;
        }

        .link{margin-top:25px;}

        /*hover effect- links glow when mouse moves over them*/
        a {
            color:#e65c00;
            text-decoration:none;
            font-size:15px;
            margin:0 12px;
            padding:8px 18px;
            border:2px solid #e65c00;
            border-radius:8px;
        }
        a:hover {

        background: #e65c00;

        color: white;

}
    </style>
</head>
<body>
    <h1>my food menu</h1>
    <p>pick your favourite dish and dig in!</p>

    <ul>
        <li>pizza</li>
        <li>burger</li>
        <li>tacos-chef's special!</li>
        <li>noodles</li>
        <li>ice cream</li>
    </ul>

    <p class="desc">every dish on this menu is made with love and loads of flavour. try then all and find your favourite</p>

    <div class="links">
        <a href="#">order now</a>
        <a href="#">see more</a>
    </div>
</body>
</html>
